name: IronPulse CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  # ---------------- Stage 1: quality gate ----------------
  test:
    name: Test (pytest + frontend build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: Run backend tests
        working-directory: backend
        run: pytest -v

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

  # ---------------- Stage 2: build, scan, push ----------------
  build-scan-push:
    name: Build, scan & push images
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # GHCR image names must be lowercase; the GitHub username may not be.
      - name: Compute image names
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          echo "BACKEND_IMAGE=${REGISTRY}/${OWNER}/ironpulse-backend" >> "$GITHUB_ENV"
          echo "FRONTEND_IMAGE=${REGISTRY}/${OWNER}/ironpulse-frontend" >> "$GITHUB_ENV"

      - name: Build images (tagged with commit SHA)
        run: |
          docker build -t "$BACKEND_IMAGE:${{ github.sha }}" ./backend
          docker build -t "$FRONTEND_IMAGE:${{ github.sha }}" ./frontend

      # trivy-action is pinned to the v0.35.0 commit SHA: the mutable version tags of
      # this action were hijacked in March 2026 (CVE-2026-33634), so tags are not trusted.
      - name: Trivy scan — backend
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

      - name: Trivy scan — frontend
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push images
        if: github.event_name != 'pull_request'
        run: |
          docker push "$BACKEND_IMAGE:${{ github.sha }}"
          docker push "$FRONTEND_IMAGE:${{ github.sha }}"
          echo "### Images pushed" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`$BACKEND_IMAGE:${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`$FRONTEND_IMAGE:${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"

  # ---------------- Stage 3: deploy to EKS with Helm ----------------
  # Runs only when the repository variable DEPLOY_ENABLED is "true" (set it once the
  # EKS cluster from terraform/ exists) and the AWS secrets below are configured.
  deploy:
    name: Deploy to EKS (Helm)
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    needs: build-scan-push
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
      CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME || 'ironpulse-eks' }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: azure/setup-helm@v4

      - name: Configure kubectl for EKS
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name "$CLUSTER_NAME"

      - name: Deploy with Helm
        env:
          PG_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          helm upgrade --install ironpulse ./helm/ironpulse \
            --namespace ironpulse --create-namespace \
            -f helm/ironpulse/values-prod.yaml \
            --set backend.image.repository=ghcr.io/${OWNER}/ironpulse-backend \
            --set backend.image.tag=${{ github.sha }} \
            --set frontend.image.repository=ghcr.io/${OWNER}/ironpulse-frontend \
            --set frontend.image.tag=${{ github.sha }} \
            --set postgres.password="${{ secrets.POSTGRES_PASSWORD }}" \
            --wait --timeout 10m

      - name: Show rollout
        run: |
          kubectl get pods,svc,ingress,hpa -n ironpulse
          helm history ironpulse -n ironpulse --max 5
