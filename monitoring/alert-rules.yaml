# Example alerts for the IronPulse API. Apply after kube-prometheus-stack is installed:
#   kubectl apply -f monitoring/alert-rules.yaml
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: ironpulse-alerts
  namespace: ironpulse
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: ironpulse.api
      rules:
        - alert: IronPulseBackendDown
          expr: absent(up{namespace="ironpulse", service=~".*-backend"} == 1)
          for: 2m
          labels: {severity: critical}
          annotations:
            summary: No IronPulse backend pod is being scraped successfully.
        - alert: IronPulseHighErrorRate
          expr: |
            sum(rate(http_requests_total{namespace="ironpulse", status="5xx"}[5m]))
              / clamp_min(sum(rate(http_requests_total{namespace="ironpulse"}[5m])), 1e-9) > 0.05
          for: 5m
          labels: {severity: warning}
          annotations:
            summary: More than 5% of IronPulse API requests are failing.
        - alert: IronPulseSlowRequests
          expr: |
            histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{namespace="ironpulse"}[5m]))) > 1
          for: 10m
          labels: {severity: warning}
          annotations:
            summary: IronPulse API p95 latency is above 1 second.
