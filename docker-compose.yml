# Full local stack: PostgreSQL + FastAPI backend + React/Nginx frontend.
#   docker compose up --build      -> http://localhost:3000 (app), http://localhost:8000/docs (API)
#   docker compose down -v         -> stop and delete the database volume
name: ironpulse

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ironpulse
      POSTGRES_USER: ironpulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ironpulse}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ironpulse -d ironpulse"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    image: ironpulse-backend:local
    environment:
      DATABASE_URL: postgresql+psycopg://ironpulse:${POSTGRES_PASSWORD:-ironpulse}@postgres:5432/ironpulse
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    image: ironpulse-frontend:local
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:8080"

volumes:
  postgres-data:
