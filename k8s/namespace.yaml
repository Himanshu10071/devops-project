apiVersion: v1
kind: Namespace
metadata:
  name: ironpulse
  labels:
    app.kubernetes.io/part-of: ironpulse
    # Pod Security Admission: every IronPulse pod (incl. Postgres) runs non-root,
    # without privilege escalation, all capabilities dropped, RuntimeDefault seccomp.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
