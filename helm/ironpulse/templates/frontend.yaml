{{- $name := printf "%s-frontend" (include "ironpulse.fullname" .) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "ironpulse.labels" . | nindent 4 }}
    {{- include "ironpulse.selector" (dict "component" "frontend" "root" .) | nindent 4 }}
spec:
  # Always set: Helm's 3-way merge leaves an HPA-scaled count alone unless this value changes.
  replicas: {{ max .Values.frontend.replicaCount (ternary .Values.hpa.frontend.minReplicas 0 .Values.hpa.frontend.enabled) }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels:
      {{- include "ironpulse.selector" (dict "component" "frontend" "root" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ironpulse.selector" (dict "component" "frontend" "root" .) | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.frontend.port }}
          env:
            - name: BACKEND_URL
              value: "http://{{ include "ironpulse.fullname" . }}-backend:{{ .Values.backend.port }}"
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          securityContext:
            {{- include "ironpulse.podSecurity" . | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "ironpulse.labels" . | nindent 4 }}
    {{- include "ironpulse.selector" (dict "component" "frontend" "root" .) | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "ironpulse.selector" (dict "component" "frontend" "root" .) | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
