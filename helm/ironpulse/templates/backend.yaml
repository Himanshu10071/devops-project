{{- $name := printf "%s-backend" (include "ironpulse.fullname" .) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "ironpulse.labels" . | nindent 4 }}
    {{- include "ironpulse.selector" (dict "component" "backend" "root" .) | nindent 4 }}
spec:
  # Always set: Helm's 3-way merge leaves an HPA-scaled count alone unless this value changes.
  replicas: {{ max .Values.backend.replicaCount (ternary .Values.hpa.backend.minReplicas 0 .Values.hpa.backend.enabled) }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels:
      {{- include "ironpulse.selector" (dict "component" "backend" "root" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ironpulse.selector" (dict "component" "backend" "root" .) | nindent 8 }}
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      initContainers:
        # Wait for PostgreSQL so migrations don't crash-loop on a cold start.
        - name: wait-for-db
          image: {{ .Values.postgres.image }}
          command: ["sh", "-c", "until pg_isready -h {{ include "ironpulse.postgresHost" . }} -p 5432; do echo waiting for db; sleep 2; done"]
          securityContext:
            {{- include "ironpulse.podSecurity" . | nindent 12 }}
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.port }}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "ironpulse.fullname" . }}-db
                  key: DATABASE_URL
            - name: EXPIRING_SOON_DAYS
              value: {{ .Values.backend.expiringSoonDays | quote }}
          # Liveness = process alive; readiness = DB reachable. Separate on purpose.
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet: {path: /ready, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          securityContext:
            {{- include "ironpulse.podSecurity" . | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "ironpulse.labels" . | nindent 4 }}
    {{- include "ironpulse.selector" (dict "component" "backend" "root" .) | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "ironpulse.selector" (dict "component" "backend" "root" .) | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.backend.port }}
      targetPort: http
