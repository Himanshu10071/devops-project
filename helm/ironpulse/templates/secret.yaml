{{- $name := printf "%s-db" (include "ironpulse.fullname" .) }}
{{- /* No password passed (e.g. CI without a POSTGRES_PASSWORD secret)? Keep the one already
     in the cluster: Postgres only reads it when the data volume is first initialised. */}}
{{- $password := .Values.postgres.password }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- if and (not $password) $existing }}
{{- $password = index $existing.data "POSTGRES_PASSWORD" | b64dec }}
{{- end }}
{{- $password = required "postgres.password must not be empty" $password }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "ironpulse.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_DB: {{ .Values.postgres.database | quote }}
  POSTGRES_USER: {{ .Values.postgres.username | quote }}
  POSTGRES_PASSWORD: {{ $password | quote }}
  DATABASE_URL: {{ printf "postgresql+psycopg://%s:%s@%s:5432/%s" .Values.postgres.username ($password | urlquery) (include "ironpulse.postgresHost" .) .Values.postgres.database | quote }}
