apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ironpulse.fullname" . }}-db
  labels:
    {{- include "ironpulse.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_DB: {{ .Values.postgres.database | quote }}
  POSTGRES_USER: {{ .Values.postgres.username | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}
  DATABASE_URL: {{ printf "postgresql+psycopg://%s:%s@%s:5432/%s" .Values.postgres.username (.Values.postgres.password | urlquery) (include "ironpulse.postgresHost" .) .Values.postgres.database | quote }}
